<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>
  <form action="" method="post" name="registration">

    <p>
      Full Name:
      <br/>
      <input type="text" name="fullname" placeholder="Enter your full name" maxlength="50" />
    </p>

    <p>
      Email:
      <br/>
      <input type="email" name="email" placeholder="you@example.com" />
    </p>

    <p>
      Password:
      <br/>
      <input type="password" name="password" placeholder="Enter your password" maxlength="20" />
    </p>

    <p>
      Phone Number:
      <br/>
      <input type="tel" name="phone" placeholder="07XXXXXXXX" />
    </p>

    <p>
      Date of Birth:
      <br/>
      <input type="date" name="dob" />
    </p>

    <p>
      Age:
      <br/>
      <input type="number" name="age" min="1" max="120" />
    </p>

    <p>
      Gender:
      <br/>
      <input type="radio" name="gender" value="male" /> Male
      <input type="radio" name="gender" value="female" /> Female
      <input type="radio" name="gender" value="other" /> Other
    </p>

    <p>
      Course:
      <br/>
      <select name="course">
        <option value="ict">ICT Management</option>
        <option value="cs">Computer Science</option>
        <option value="se">Software Engineering</option>
        <option value="is">Information Systems</option>
      </select>
    </p>

    <p>
      Skills (select all that apply):
      <br/>
      <input type="checkbox" name="skills" value="html" /> HTML
      <input type="checkbox" name="skills" value="css" /> CSS
      <input type="checkbox" name="skills" value="aws" /> AWS
      <input type="checkbox" name="skills" value="python" /> Python
    </p>

    <p>
      Confidence Level:
      <br/>
      <input type="range" name="confidence" min="0" max="100" />
    </p>

    <p>
      Favorite Color:
      <br/>
      <input type="color" name="favcolor" />
    </p>

    <p>
      Upload Profile Picture:
      <br/>
      <input type="file" name="profilepic" accept="image/*" />
    </p>

    <p>
      Tell us about yourself:
      <br/>
      <textarea name="bio" cols="30" rows="5"></textarea>
    </p>

    <p>
      <input type="checkbox" name="terms" /> I agree to the terms and conditions
    </p>

    <p>
      <input type="submit" value="Register" />
      <input type="reset" value="Clear Form" />
    </p>

  </form>
</body>
</html>
